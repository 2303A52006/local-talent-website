<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .talent-header {
            background: linear-gradient(120deg, #0d6efd, #0b1736);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .talent-img {
            width: 100%;
            border-radius: 10px;
            height: 350px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TalentShowcase</a>
        </div>
    </nav>

    <!-- HERO -->
    <div class="talent-header text-center">
        <h1 id="talentName">Loading...</h1>
        <p id="talentCategory" class="lead"></p>
    </div>

    <!-- CONTENT -->
    <div class="container">
        <div class="row mb-5">
            <div class="col-lg-6">
                <img id="talentImage" src="" class="talent-img shadow" alt="Talent Image">
            </div>

            <div class="col-lg-6">
                <h3>About</h3>
                <p id="talentDescription"></p>

                <h4>Skills</h4>
                <ul id="talentSkills"></ul>

                <h4>Contact</h4>
                <p id="talentContact"></p>

                <a href="index.html" class="btn btn-primary mt-3">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // -------- SAMPLE DATA ----------
        const talents = {
            1: {
                name: "Aarav Kumar",
                category: "Photography",
                image: "https://source.unsplash.com/600x400/?photographer",
                description: "Nature and wildlife photographer with 5+ years experience.",
                skills: ["Wildlife Photography", "Nature Shots", "Editing"],
                contact: "aarav.photography@example.com"
            },
            2: {
                name: "Sana Sharma",
                category: "Art",
                image: "https://source.unsplash.com/600x400/?painting",
                description: "Watercolor and sketching artist with exhibitions in 3 cities.",
                skills: ["Sketching", "Watercolors", "Portrait Art"],
                contact: "sana.art@example.com"
            },
            3: {
                name: "Rohan Verma",
                category: "Music",
                image: "https://source.unsplash.com/600x400/?singer",
                description: "Singer & guitarist with stage experience in over 20 events.",
                skills: ["Singing", "Guitar", "Stage Performance"],
                contact: "rohan.music@example.com"
            },
            4: {
                name: "Neha Patel",
                category: "Dance",
                image: "https://source.unsplash.com/600x400/?dance",
                description: "Classical & western fusion dancer and choreographer.",
                skills: ["Classical Dance", "Fusion", "Choreography"],
                contact: "neha.dance@example.com"
            },
            5: {
                name: "Kiran Yadav",
                category: "Coding",
                image: "https://source.unsplash.com/600x400/?programmer",
                description: "Full-stack developer building creative web apps.",
                skills: ["HTML", "CSS", "JS", "React", "Node"],
                contact: "kiran.dev@example.com"
            }
        };

        // READ ID FROM URL
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");

        const data = talents[id];

        // POPULATE PAGE
        if (data) {
            document.getElementById("talentName").innerText = data.name;
            document.getElementById("talentCategory").innerText = data.category;
            document.getElementById("talentImage").src = data.image;
            document.getElementById("talentDescription").innerText = data.description;

            document.getElementById("talentContact").innerText = data.contact;

            let skillsHTML = "";
            data.skills.forEach(s => skillsHTML += `<li>${s}</li>`);
            document.getElementById("talentSkills").innerHTML = skillsHTML;
        } else {
            document.body.innerHTML = "<h2 class='text-center mt-5'>Talent not found.</h2>";
        }
    </script>

</body>
</html>
